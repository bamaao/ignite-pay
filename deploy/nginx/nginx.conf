# ============================================================
# Ignite Pay — Nginx Reverse Proxy Configuration
#
# All backend services are proxied through a single Nginx
# instance using URL path prefixes:
#
#   /didcomm/*   → DIDComm Router (user-side :8080)
#   /merchant/*  → DIDComm Router (merchant-side :4000)
#   /did/*       → DID Registry (:8081)
#   /channel/*   → Channel User (:3001)
#   /provider/*  → Channel Provider (:3002)
#   /hub/*       → Channel Hub (:3003)
#   /registry/*  → Hub Registry (:3004)
# ============================================================

# --------------- Upstream definitions ---------------

upstream didcomm_router {
    server router-user:8080;
}

upstream didcomm_router_merchant {
    server router-merchant:4000;
}

upstream did_registry {
    server did-registry:8081;
}

upstream channel_user {
    server channel-user:3001;
}

upstream channel_provider {
    server channel-provider:3002;
}

upstream channel_hub {
    server channel-hub:3003;
}

upstream hub_registry {
    server hub-registry:3004;
}

# --------------- HTTP → HTTPS redirect ---------------

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --------------- Main HTTPS server ---------------

server {
    listen 443 ssl;
    server_name _;

    # TLS certificates
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------- Health check ---------------
    location /health {
        proxy_pass http://didcomm_router;
    }

    # --------------- DIDComm Router (user-side) ---------------
    # REST API
    location /didcomm/v1/ {
        rewrite ^/didcomm(/.*)$ $1 break;
        proxy_pass http://didcomm_router;
    }
    # WebSocket
    location /didcomm/ws {
        rewrite ^/didcomm(/.*)$ $1 break;
        proxy_pass http://didcomm_router;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Raw DIDComm
    location /didcomm/ {
        rewrite ^/didcomm(/.*)$ $1 break;
        proxy_pass http://didcomm_router;
    }

    # --------------- DIDComm Router (merchant-side) ---------------
    location /merchant/v1/ {
        rewrite ^/merchant(/.*)$ $1 break;
        proxy_pass http://didcomm_router_merchant;
    }
    location /merchant/ws {
        rewrite ^/merchant(/.*)$ $1 break;
        proxy_pass http://didcomm_router_merchant;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /merchant/ {
        rewrite ^/merchant(/.*)$ $1 break;
        proxy_pass http://didcomm_router_merchant;
    }

    # --------------- DID Registry ---------------
    location /did/ {
        rewrite ^/did(/.*)$ $1 break;
        proxy_pass http://did_registry;
    }

    # --------------- Channel User ---------------
    location /channel/ws {
        rewrite ^/channel(/.*)$ $1 break;
        proxy_pass http://channel_user;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /channel/ {
        rewrite ^/channel(/.*)$ $1 break;
        proxy_pass http://channel_user;
    }

    # --------------- Channel Provider ---------------
    location /provider/ws {
        rewrite ^/provider(/.*)$ $1 break;
        proxy_pass http://channel_provider;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /provider/ {
        rewrite ^/provider(/.*)$ $1 break;
        proxy_pass http://channel_provider;
    }

    # --------------- Channel Hub ---------------
    location /hub/ws {
        rewrite ^/hub(/.*)$ $1 break;
        proxy_pass http://channel_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /hub/ {
        rewrite ^/hub(/.*)$ $1 break;
        proxy_pass http://channel_hub;
    }

    # --------------- Hub Registry ---------------
    location /registry/ {
        rewrite ^/registry(/.*)$ $1 break;
        proxy_pass http://hub_registry;
    }
}
