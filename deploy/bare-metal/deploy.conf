# ============================================================
# Ignite Pay — Bare-Metal Deployment Configuration
# Edit this file, then run: sudo ./deploy.sh install
# ============================================================

# --------------- Installation Directories ---------------
# Where to install compiled binaries
INSTALL_DIR="/opt/ignite-pay"
# Where to store persistent data (sled databases)
DATA_DIR="/var/lib/ignite-pay"
# Where to store config files
CONFIG_DIR="/etc/ignite-pay"
# Where to store logs
LOG_DIR="/var/log/ignite-pay"
# User to run services as (created automatically)
SERVICE_USER="ignite-pay"

# --------------- Solana RPC ---------------
SOLANA_RPC_URL="https://api.devnet.solana.com"
SOLANA_NETWORK="devnet"
# Photon RPC for ZK Compression (Helius) — leave empty if unused
PHOTON_RPC_URL=""

# --------------- On-chain Program IDs ---------------
CHANNEL_PROGRAM_ID="DJBHr35jL3JAGoU7bKMsEFmpeNMrCSK7oYQE4HJ3GBUe"
DID_PROGRAM_ID="D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D1D"
SESSION_PROGRAM_ID="6EFvVTh7rEBpHH2JGryjKQmBLRtbYtSEerGNfkHqKiei"

# --------------- DIDComm Router (user-side) ---------------
ROUTER_USER_PORT=8080
ROUTER_USER_DID="did:ignite:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK"

# --------------- DIDComm Router (merchant-side) ---------------
ROUTER_MERCHANT_PORT=4000
ROUTER_MERCHANT_DID="did:ignite:z6MkMerchantRouterDIDPlaceholder"

# --------------- DID Registry ---------------
DID_REGISTRY_PORT=8081
DID_REGISTRY_JWT_SECRET="did-registry-secret"
# Absolute path to Solana payer keypair
DID_REGISTRY_PAYER_KEYPAIR=""
# Absolute path to platform Ed25519 signing key (32 bytes)
PLATFORM_SIGNING_KEY_PATH=""

# --------------- Channel Services ---------------
CHANNEL_USER_PORT=3001
CHANNEL_PROVIDER_PORT=3002
CHANNEL_HUB_PORT=3003

# --------------- Hub Registry ---------------
HUB_REGISTRY_PORT=3004
# PostgreSQL connection
