[package]
name = "ignite-pay-did-program"
version = "0.1.0"
edition = "2021"
description = "On-chain Solana program for DID merchant identity management via MerchantCompressedDid using ZK Compression"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
zk-compression = ["light-sdk"]
idl-build = ["anchor-lang/idl-build", "light-sdk?/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
light-sdk = { version = "0.23.0", features = ["anchor"], optional = true }
ed25519-dalek = { version = "1", default-features = false, features = ["u64_backend"] }
getrandom = { version = "0.1", features = ["dummy"] }

[dev-dependencies]
ed25519-dalek = { version = "1", features = ["rand"] }
rand = "0.7"

[profile.release]
overflow-checks = true
