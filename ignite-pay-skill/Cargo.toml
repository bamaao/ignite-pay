[package]
name = "ignite_pay_rs"
version = "0.1.0"
edition = "2021"
authors = ["zouyccq@gmail.com"]
description = "Web3 Agent Payment SDK with DIDComm and X402 support"

[lib]
name = "ignite_pay_rs"
crate-type = ["cdylib"]

[dependencies]
# Shared library
ignite-pay-core = { path = "../ignite-pay-core" }

# PyO3 core
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

# Async
tokio = { version = "1.0", features = ["full"] }
lazy_static = "1.4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.0", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# Database
sled = "0.34"

# WebSocket
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# DIDComm (still needed for direct DIDCommAgent usage)
affinidi-messaging-didcomm = "0.13"
