[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ignite-pay-skill"
version = "0.1.0"
description = "Ignite Pay Skill - Rust-powered payment skill with Python bindings"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
