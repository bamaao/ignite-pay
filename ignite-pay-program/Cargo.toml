[package]
name = "ignite-pay-program"
version = "0.1.0"
edition = "2021"
description = "On-chain Solana program for Ignite Pay state channel"

[lib]
crate-type = ["cdylib", "lib"]

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.0", features = ["idl-build"] }
anchor-spl = { version = "1.0.0", features = ["idl-build"] }
solana-program = "~2.2"

[profile.release]
overflow-checks = true
