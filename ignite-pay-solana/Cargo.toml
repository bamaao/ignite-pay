[package]
name = "ignite-pay-solana"
version = "0.1.0"
edition = "2021"
description = "Solana integration for Ignite Pay: DID-based merchant identity, Session Keys, and on-chain payments"

[dependencies]
# Solana SDK & client
solana-sdk = "2.1"
solana-client = "2.1"

# SPL programs
spl-token = "7"
spl-associated-token-account = "6"

# ZK Compression
light-sdk = "0.23.0"
light-client = "0.23.0"

# Serialization
borsh = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
bs58 = "0.5"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Persistence
sled = "0.34"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
