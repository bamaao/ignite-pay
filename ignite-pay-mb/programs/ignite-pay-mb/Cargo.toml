[package]
name = "ignite-pay-mb"
version = "0.1.0"
edition = "2021"
description = "On-chain Solana program for Ignite Pay MagicBlock settlement"

[lib]
crate-type = ["cdylib", "lib"]

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.1"
solana-hash = "4"
solana-sha256-hasher = "3.1"
solana-instruction = "3"
solana-instructions-sysvar = "3"
