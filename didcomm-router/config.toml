[server]
host = "0.0.0.0"
port = 8080

[router]
# In-memory storage limits
max_queued_messages = 1000
max_message_age_seconds = 86400

# Pre-configured peers (keys registered at startup)
# [[router.known_peers]]
# did = "did:ignite:z6Mk..."
# key_agreement_kid = "did:ignite:z6Mk...#key-agreement-1"
# key_agreement_public_base64 = "..."

# TLS (optional — uncomment and set paths to enable built-in TLS)
# When using nginx reverse proxy, leave this commented out.
# [tls]
# cert_path = "./certs/tls.crt"
# key_path = "./certs/tls.key"

# FCM push notifications (optional — leave commented to disable)
# [fcm]
# service_account_json = "./firebase-service-account.json"
# project_id = "ignite-pay-d1217"

# Persistent storage (optional — omit to use in-memory stores)
[storage]
path = "./data"
