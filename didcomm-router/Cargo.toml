[package]
name = "didcomm-router"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared library
ignite-pay-core = { path = "../ignite-pay-core" }

# DIDComm messaging
affinidi-messaging-didcomm = "0.13"

# Web framework
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Concurrency
dashmap = "6"

# Persistence
sled = "0.34"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Config
toml = "0.8"

# Async traits
async-trait = "0.1"

# UUID for message IDs
uuid = { version = "1", features = ["v4"] }

# Crypto for DID signature verification
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"

# Time
chrono = "0.4"

# JWT authentication
jsonwebtoken = "9"

# HTTP client (for FCM)
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
