[package]
name = "didcomm-mediator"
version = "0.1.0"
edition = "2021"

[dependencies]
# DIDComm messaging
affinidi-messaging-didcomm = "0.13"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Concurrency
dashmap = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config
toml = "0.8"

# Async traits
async-trait = "0.1"

# UUID for message IDs
uuid = { version = "1", features = ["v4"] }

# Time
chrono = "0.4"
