[mcp]
# SSE/Streamable HTTP port (0 = disabled)
sse_port = 9001

[mediator]
ws_url = "ws://192.168.0.100:8080/ws"
# DID of the phone app to send authorization requests to
phone_did = ""

[storage]
# sled database path
path = "./data"

[policy]
# Auto-approve payments under this amount (in smallest unit)
auto_approve_max = 0
# Authorization timeout in seconds
auth_timeout = 300

[platform]
# Platform DID that issues merchant VCs
did = "did:ignite:zPlatformDIDPlaceholder"
# Platform Ed25519 verifying key (base64 no-pad)
verifying_key_b64 = ""

[ipfs]
# IPFS mode: "mock" (development) or "kubo" (production, requires local Kubo node)
mode = "mock"
# Kubo RPC URL (only used when mode = "kubo")
kubo_url = "http://127.0.0.1:5001"

[solana]
# Solana RPC endpoint
rpc_url = "https://api.devnet.solana.com"
# DID program ID (ignite-pay-did-program) — enables on-chain DID verification
did_program_id = ""
# Payment mode: "self_funded" or "sponsored"
pay_mode = "self_funded"
# Relayer URL (only used when pay_mode = "sponsored")
relayer_url = ""
# Default owner pubkey (base58) for local session lookup
default_owner = ""
# --- ZK Compression fields (only needed with --features zk-compression) ---
# Photon RPC URL for ZK Compression queries (e.g. https://photon.helius.com?api-key=KEY)
# photon_url = ""
# Address Merkle tree pubkey — used to derive compressed DID addresses
# address_tree = ""

[magicblock]
# MagicBlock RPC endpoint
rpc_url = "https://api.devnet.solana.com"
# MagicBlock ephemeral rollup program ID
program_id = "6pFXAg1oiV61wVvaJvMHqYdGMe2fscDwmN9UBUSvNuU3"
