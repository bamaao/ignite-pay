[package]
name = "ignite-pay-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ignite-pay-mcp"
path = "src/main.rs"

[dependencies]
# Shared library
ignite-pay-core = { path = "../ignite-pay-core", features = ["solana"] }
ignite-pay-solana = { path = "../ignite-pay-solana" }

# MCP SDK
rmcp = { version = "1.3", features = ["transport-io"] }
schemars = "1"

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1"

# Encoding
bs58 = "0.5"

# DIDComm (still needed for direct DIDCommAgent usage)
affinidi-messaging-didcomm = "0.13"
base64 = "0.22"

# WebSocket (pure Rust TLS, no system OpenSSL needed)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# State persistence
sled = "0.34"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# QR code generation
qrcode = "0.14"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.8"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
