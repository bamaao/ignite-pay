[package]
name = "ignite-pay-mcp"
version = "0.1.0"
edition = "2021"

[features]
default = []
zk-compression = ["ignite-pay-core/zk-compression", "ignite-pay-solana/zk-compression"]

[[bin]]
name = "ignite-pay-mcp"
path = "src/main.rs"

[dependencies]
# Shared library
ignite-pay-core = { path = "../ignite-pay-core", features = ["solana", "kubo"] }
ignite-pay-solana = { path = "../ignite-pay-solana" }
ignite-pay-mb-sdk = { path = "../ignite-pay-mb/sdk" }

# MagicBlock payment channels
solana-sdk = "2.1"
solana-client = "2.1"

# HTTP client for Hub communication
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Hex encoding for channel IDs
hex = "0.4"

# MCP SDK
rmcp = { version = "1.5", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"

# HTTP server for SSE transport
axum = { version = "0.8", features = ["http1", "tokio", "json", "query"], default-features = false }
tokio-util = "0.7"

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "0.10"

# Encoding
bs58 = "0.5"

# DIDComm (still needed for direct DIDCommAgent usage)
affinidi-messaging-didcomm = "0.13"
base64 = "0.22"

# WebSocket (pure Rust TLS, no system OpenSSL needed)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# State persistence
sled = "0.34"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# QR code generation
qrcode = "0.14"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.8"
dashmap = "6"

[dev-dependencies]
tempfile = "3"
