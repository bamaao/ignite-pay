[package]
name = "ignite-pay-merchant-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ignite-pay-merchant-mcp"
path = "src/main.rs"

[dependencies]
# Shared libraries
ignite-pay-core = { path = "../ignite-pay-core", features = ["solana"] }
ignite-pay-state-channel = { path = "../ignite-pay-state-channel" }
ignite-pay-solana = { path = "../ignite-pay-solana" }

# MCP SDK
rmcp = { version = "1.5", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"

# HTTP server for SSE transport
axum = { version = "0.8", features = ["http1", "tokio"], default-features = false }
tokio-util = "0.7"

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "0.10"

# Encoding
bs58 = "0.5"
base64 = "0.22"

# ed25519-dalek v1 for state channel Keypair operations
ed25519-dalek-v1 = { package = "ed25519-dalek", version = "1" }

# DIDComm
affinidi-messaging-didcomm = "=0.13.0"

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# State persistence
sled = "0.34"

# HTTP client for Hub communication
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# QR code generation
qrcode = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.8"
dashmap = "6"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
