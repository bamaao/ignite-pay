# Merchant MCP configuration

[mcp]
# SSE/Streamable HTTP port (0 = disabled)
sse_port = 9002

[merchant]
# Merchant DID (auto-generated on first run if empty)
did = ""
# Hub HTTP endpoint for state channel operations
hub_endpoint = "http://localhost:3003"
# Hub WebSocket endpoint
hub_ws_url = "ws://localhost:3003/ws"
# Merchant Solana wallet address for receiving payments (base58)
wallet = ""
# Accepted tokens for QR payments
accept_tokens = ["USDC"]

[mediator]
# DIDComm mediator WebSocket URL
ws_url = "ws://localhost:4000/ws"

[storage]
path = "./data/merchant-mcp"

[solana]
rpc_url = "https://api.devnet.solana.com"
# Program ID for the state channel on-chain program
program_id = ""

[hub]
# Default token mint for channel payments (empty = native SOL)
token_mint = ""
# Provider public key (Hub's pubkey, set to match the Hub you connect to)
provider_pubkey = ""

[did_registry]
# DID Registry service URL for VC issuance and on-chain ZK DID registration
url = "http://localhost:8081"

[[products]]
id = "coffee"
name = "Coffee"
price = 100000
description = "A cup of coffee"

[[products]]
id = "sandwich"
name = "Sandwich"
price = 250000
description = "Fresh sandwich"
